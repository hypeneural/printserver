name: PrintServer Validation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run test:fixture
  windows-powershell-syntax:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 scripts without executing or printing
        shell: powershell
        run: |
          $scripts = @('windows/agent.ps1', 'windows/install-task.ps1', 'scripts/Test-LabelPrinter.ps1', 'scripts/Prepare-SumatraPortable.ps1', 'windows/Invoke-SyntheticPrintTest.ps1', 'windows/Invoke-CrmArtworkPrintTest.ps1')
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell syntax invalid ($path): $messages"
            }
          }
          $config = Get-Content windows/config.example.json -Raw | ConvertFrom-Json
          if ($config.enable_printing -ne $false -or $config.calibration_confirmed_100x40 -ne $false) {
            throw 'Example configuration must remain fail-closed'
          }
          $dryInstall = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Prepare-SumatraPortable.ps1 | ConvertFrom-Json
          if ($dryInstall.writes_performed -ne $false -or $dryInstall.install_requested -ne $false) {
            throw 'Portable installer dry-run performed a write'
          }
          $dryPrint = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/Invoke-SyntheticPrintTest.ps1
          if ($dryPrint -notmatch '^NOT_EXECUTED:') {
            throw 'Synthetic printing script did not fail closed without authorization'
          }
          $dryCrm = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/Invoke-CrmArtworkPrintTest.ps1
          if ($dryCrm -notmatch '^NOT_EXECUTED:') {
            throw 'CRM artwork printing script did not fail closed without authorization'
          }
